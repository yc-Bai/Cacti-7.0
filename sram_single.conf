# Trusted Bash config for run_sram_analysis.sh single mode.
# Do not use untrusted config files because the runner sources this file.

RUN_NAME="sram_1024x64_sp_28nm"
PORT_MODE="single"        # single = 1RW, dual = 1R1W
WIDTH_BITS=64
DEPTH_WORDS=1024

TECH_UM=0.028
TEMPERATURE_K=360
DATA_CELL_TYPE="itrs-hp"
DATA_PERIPHERAL_TYPE="itrs-hp"

# Runner-level power assumptions. CACTI reports access energy; the runner
# converts dynamic power as energy_nJ * frequency_MHz * activity.
FREQUENCY_MHZ=500
READ_ACTIVITY=1.0
WRITE_ACTIVITY=0.0

UCA_BANK_COUNT=1
WIRE_SIGNALING="Global_30"
WIRE_INSIDE_MAT="semi-global"
WIRE_OUTSIDE_MAT="semi-global"
INTERCONNECT_PROJECTION="conservative"
PRINT_LEVEL="DETAILED"
FORCE_CACHE_CONFIG="false"
NDWL=1
NDBL=1
NSPD=0
NDCM=1
NDSAM1=0
NDSAM2=0
